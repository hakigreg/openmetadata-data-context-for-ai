source:
  type: postgres
  serviceName: digital_commerce_postgres
  serviceConnection:
    config:
      type: Postgres
      username: ${COMMERCE_DB_USER}
      authType:
        password: ${COMMERCE_DB_PASSWORD}
      hostPort: analytics-postgres:5432
      database: chinook
      sslMode: disable
      connectionOptions: {}
      connectionArguments: {}
  sourceConfig:
    config:
      type: Profiler
      schemaFilterPattern:
        includes:
          - ^marts$
      tableFilterPattern:
        includes:
          - ^dim_.*
          - ^fct_.*
          - ^mart_.*
processor:
  type: orm-profiler
  config:
    tableConfig:
      profileSampleType: PERCENTAGE
      profileSample: 100
sink:
  type: metadata-rest
  config: {}
workflowConfig:
  loggerLevel: INFO
  openMetadataServerConfig:
    hostPort: http://openmetadata-server:8585/api
    authProvider: openmetadata
    securityConfig:
      jwtToken: ${OPENMETADATA_JWT_TOKEN}
